name: baust_nexus
description: BAUST Nexus - Smart Campus Companion App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  intl: ^0.20.1
  supabase_flutter: ^2.12.4
  file_picker: ^8.1.4
  open_file: ^3.3.2
  path_provider: ^2.1.2
  http: ^1.1.0
  share_plus: ^10.1.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^6.0.1
  fl_chart: ^1.2.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/